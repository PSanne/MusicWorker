name: Release

# Veröffentlicht ein GitHub-Release mit ZIP-Download. Zwei Wege:
#  1. Actions → „Release“ → „Run workflow“ → Versionsnummer eingeben (legt die Marke selbst an)
#  2. Eine Versionsmarke wie "v0.2.0" pushen
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer ohne „v“, z. B. 0.2.0"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test MusicWorker.sln --configuration Release

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          dotnet publish src/MusicWorker.App/MusicWorker.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version --output publish
          Compress-Archive -Path publish/* -DestinationPath "MusicWorker-$($env:TAG)-win-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: MusicWorker ${{ env.TAG }}
          files: MusicWorker-${{ env.TAG }}-win-x64.zip
          body: |
            ## Installation
            1. Unten bei **Assets** die Datei `MusicWorker-${{ env.TAG }}-win-x64.zip` herunterladen.
            2. ZIP-Datei entpacken (Rechtsklick → „Alle extrahieren …“).
            3. `MusicWorker.exe` starten – es muss kein .NET installiert sein.

            Falls Windows SmartScreen warnt: **„Weitere Informationen“ → „Trotzdem ausführen“**
            (die Datei ist nicht digital signiert).

            Alle Funktionen und Tastenkürzel stehen in der [README](https://github.com/${{ github.repository }}#readme).
